# a backend: no bundler and no UI framework, so the app has no pages
- name: '@cormijs/preset'
# the database of server/: ctx.model and ctx.database, with SQLite
- name: '@cormijs/database'
- name: '@minatojs/driver-sqlite'
  config:
    path: data/app.db
# the cache of server/: ctx.cache, in memory; @cormijs/cache-redis or -database instead to share it
- name: '@cormijs/cache'
