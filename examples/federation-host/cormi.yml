- name: '@cormi/preset-react'
  config:
    title: Cormi · federation
    port: 8010
- name: '@cormi/plugin-federation/host'
  config:
    # written to packages.json, which can be edited where the host is deployed
    packages:
      - !!js "process.env.USERS_URL || 'http://localhost:8012/'"
      - !!js "process.env.ORDERS_URL || 'http://localhost:8011/'"
