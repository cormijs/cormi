# the app, its bundler and its UI framework; @cormijs/preset-react is the same in one entry
- name: '@cormijs/preset'
  config:
    title: Cormi Basic
    ssr: true
    proxy:
      # forwards /proxy/* to this app's own API, to show the option
      /proxy:
        target: !!js "'http://localhost:' + (process.env.CORMI_PORT || 8000) + '/api'"
        pathRewrite:
          ^/proxy: ''
- name: '@cormijs/vite'
- name: '@cormijs/react'
- name: ./plugin.ts
  config:
    generator: cormi
# pre-renders the pages into dist/ after builds
- name: '@cormijs/plugin-export-static'
  config:
    extraRoutePaths: [/users/1]
